<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Application Sécurisée</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="login-container">
        <h2>🔐 Veuillez vous identifier</h2>

        <!-- Message d'erreur si identifiants invalides -->
        <div th:if="${param.error}" class="alert alert-error">
            ⚠️ Identifiant ou mot de passe invalide.
        </div>

        <!-- Message de succès après déconnexion -->
        <div th:if="${param.logout}" class="alert alert-success">
            ✅ Vous avez été déconnecté avec succès.
        </div>

        <!-- Formulaire de connexion vers /login (Spring Security) -->
        <form th:action="@{/login}" method="post">
            <!-- Token CSRF géré automatiquement par Thymeleaf -->
            <div class="form-group">
                <label for="username">Nom d'utilisateur :</label>
                <input type="text" id="username" name="username" placeholder="Entrez votre nom d'utilisateur" required autofocus />
            </div>

            <div class="form-group">
                <label for="password">Mot de passe :</label>
                <input type="password" id="password" name="password" placeholder="Entrez votre mot de passe" required />
            </div>

            <button type="submit" class="btn btn-primary">Se connecter</button>
        </form>

        <!-- Comptes de test prédéfinis en mémoire -->
        <div class="accounts-info">
            <p><strong>Comptes en mémoire disponibles :</strong></p>
            <p>👤 Utilisateur : <code>user</code> / <code>1111</code> (Rôle : USER)</p>
            <p>👑 Administrateur : <code>admin</code> / <code>1234</code> (Rôles : ADMIN, USER)</p>
        </div>

        <div style="text-align: center; margin-top: 1rem;">
            <a th:href="@{/}" style="color: var(--primary); text-decoration: none; font-size: 0.9rem;">← Retour à l'accueil</a>
        </div>
    </div>
</body>
</html>
